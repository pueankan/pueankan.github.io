<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>สรุปค่าเช่า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --ink:#1b3f8f; --navy:#12203f; --muted:#5b6785; --rule:#c9d3ea; --rule2:#e3e8f4; --tint:#eef2fa; --paper:#ffffff;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --track:#cde2fb;
    --good:#0ca30c; --critical:#d03b3b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--navy);font-family:'IBM Plex Sans Thai Looped',Sarabun,Tahoma,sans-serif;font-size:16px;line-height:1.5}
  .top{background:var(--ink);color:#fff;padding:22px 0 26px}
  .top .in, main{max-width:860px;margin:0 auto}
  .top .in{padding:0 20px}
  .top h1{margin:0;font-size:22px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .top h1 span{font-size:16px;font-weight:400;opacity:.86;white-space:nowrap}
  .hero{margin-top:20px}
  .hero .lab{font-size:17px;opacity:.9}
  .hero .val{font-size:60px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
  .hero .val small{font-size:22px;font-weight:500;margin-left:8px}
  .meter{height:12px;border-radius:6px;background:rgba(255,255,255,.26);margin:14px 0 8px;overflow:hidden}
  .meter i{display:block;height:100%;background:#fff;border-radius:6px 0 0 6px;min-width:0}
  .hero .sub{font-size:16px;opacity:.92}
  main{padding:4px 20px 40px}
  section{padding:22px 0 6px;border-top:3px solid var(--ink);margin-top:22px}
  section:first-child{border-top:0;margin-top:0}
  h2{margin:0 0 4px;font-size:19px;font-weight:600;color:var(--ink)}
  .note{color:var(--muted);font-size:14.5px;margin:0 0 12px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px}
  .tile{padding:4px 14px;border-left:1px solid var(--rule)}
  .tile:first-child{border-left:0;padding-left:0}
  .tile .n{font-size:32px;font-weight:700;line-height:1.15}
  .tile .n small{font-size:15px;font-weight:500;color:var(--muted);margin-left:5px}
  .tile .l{font-size:15px;color:var(--muted)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:baseline}
  .stack{display:flex;height:22px;gap:2px;margin:14px 0 12px}
  .stack i{display:block;height:100%;min-width:2px}
  .stack i:first-child{border-radius:4px 0 0 4px}.stack i:last-child{border-radius:0 4px 4px 0}
  table{width:100%;border-collapse:collapse;font-size:16px}
  th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--rule2);font-variant-numeric:tabular-nums;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;padding-left:0}
  th:last-child,td:last-child{padding-right:0}
  th{font-weight:600;color:var(--ink);font-size:14.5px;border-bottom:2px solid var(--ink);white-space:nowrap}
  td.m{color:var(--muted)}
  tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:9px;vertical-align:-1px}
  .owe{list-style:none;margin:8px 0 0;padding:0}
  .owe li{display:grid;grid-template-columns:minmax(120px,38%) 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule2)}
  .owe .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .owe .bar{height:10px;background:transparent}
  .owe .bar i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0;min-width:3px}
  .owe .amt{font-variant-numeric:tabular-nums;font-weight:600;min-width:74px;text-align:right}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chips span{background:var(--tint);border-radius:999px;padding:5px 13px;font-size:15px}
  .ok{display:flex;align-items:center;gap:10px;font-weight:500;margin-top:8px}
  .ok svg{flex:none}
  svg text{font-family:inherit}
  #tip{position:fixed;z-index:9;pointer-events:none;background:var(--navy);color:#fff;font-size:14px;padding:6px 10px;border-radius:8px;display:none;max-width:240px;line-height:1.4}
  .foot{color:var(--muted);font-size:13.5px;margin-top:26px}
  #empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:18px;display:none}
  [data-tip]{cursor:default}
  @media (max-width:520px){ .hero .val{font-size:48px} .tile .n{font-size:27px} .tile{padding:4px 10px} th,td{padding:9px 5px;font-size:15px} .wide th,.wide td{padding:8px 3px;font-size:13px} .wide th{font-size:12.5px} }
</style>
</head>
<body>
<div class="top"><div class="in">
  <h1>สรุปค่าเช่า <span id="round"></span></h1>
  <div class="hero" id="hero"></div>
</div></div>
<main id="main"></main>
<div id="empty">ยังไม่มีข้อมูล กลับไปที่แอปแล้วกดปุ่ม “สรุปแบบกราฟ” ที่เมนูสรุป</div>
<div id="tip" role="status"></div>
<script>
(function(){
  var TH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  function num(s){ var n=parseFloat(String(s==null?'':s).replace(/,/g,'')); return isNaN(n)?0:n; }
  function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
  function ymLabel(ym, short){ var m=/^(\d{4})-(\d{1,2})/.exec(ym||''); if(!m) return ym||''; var mo=TH[parseInt(m[2],10)-1]||'', y=parseInt(m[1],10)+543; return short===true? mo : short==='yy'? mo+' '+String(y).slice(-2) : mo+' '+y; }
  function list(s){ s=String(s||'').trim(); if(!s) return []; return s.split(/\s*;\s*|\s+,\s+/).filter(function(x){return x.trim()!==''}); }
  function getHash(cb){
    try{ if(window.google && google.script && google.script.url){ google.script.url.getLocation(function(l){ cb(l.hash||''); }); return; } }catch(e){}
    cb(String(location.hash||'').replace(/^#/,''));
  }
  function render(raw){
    var parts=raw.split('|'); if(parts.length<3){ document.getElementById('empty').style.display='block'; document.querySelector('.top').style.display='none'; return; }
    var meta=parts[0].split('~'), roomsTotal=num(meta[0]), vacant=num(meta[1]);
    var bills=list(parts[1]).map(function(s){ var a=s.split('~'); return {name:(a[0]||'').trim(), ym:(a[1]||'').trim(), rent:num(a[2]), elec:num(a[3]), water:num(a[4]), trash:num(a[5]), carry:num(a[6]), disc:num(a[7]), total:num(a[8]), paid:num(a[9]), remain:num(a[10]), wait:(a[11]||'').trim()==='W'}; });
    var months=list(parts[2]).map(function(s){ var a=s.split('~'); return {ym:(a[0]||'').trim(), rent:num(a[1]), elec:num(a[2]), water:num(a[3]), trash:num(a[4]), disc:num(a[5]), paid:num(a[6]), remain:num(a[7]), count:num(a[8])}; }).filter(function(m){return /^\d{4}-\d/.test(m.ym)});
    months.forEach(function(m){ m.rev=m.rent+m.elec+m.water+m.trash-m.disc; });
    months.sort(function(a,b){ return a.ym<b.ym?-1:a.ym>b.ym?1:0; });
    var latestYm=bills.reduce(function(mx,b){ return b.ym>mx?b.ym:mx; },'');
    var cur=bills.filter(function(b){ return b.ym===latestYm; });
    var S=function(k){ return cur.reduce(function(t,b){return t+b[k]},0); };
    var billed=S('total'), paid=S('paid'), remain=cur.reduce(function(t,b){return t+Math.max(0,b.remain)},0);
    var waiting=cur.filter(function(b){return b.wait});
    var owing=cur.filter(function(b){return !b.wait && b.remain>0}).sort(function(a,b){return b.remain-a.remain});
    var done=cur.filter(function(b){return !b.wait && b.remain<=0});
    var pct=billed>0? Math.max(0,Math.min(100,paid/billed*100)) : 0;
    if(latestYm && cur.length){
      var live={ym:latestYm, rent:S('rent'), elec:S('elec'), water:S('water'), trash:S('trash'), disc:S('disc'), paid:paid, remain:remain, count:cur.length};
      live.rev=live.rent+live.elec+live.water+live.trash-live.disc;
      months=months.filter(function(m){ return m.ym!==latestYm; }); months.push(live);
      months.sort(function(a,b){ return a.ym<b.ym?-1:a.ym>b.ym?1:0; });
    }

    document.getElementById('round').textContent = latestYm? 'รอบ '+ymLabel(latestYm) : '';
    document.getElementById('hero').innerHTML =
      '<div class="lab">ยังค้างชำระ</div>'+
      '<div class="val">'+fmt(remain)+'<small>บาท</small></div>'+
      '<div class="meter" role="img" aria-label="เก็บเงินได้ '+Math.round(pct)+' เปอร์เซ็นต์"><i style="width:'+pct+'%"></i></div>'+
      '<div class="sub">เก็บได้แล้ว '+fmt(paid)+' จากยอดบิล '+fmt(billed)+' บาท ('+Math.round(pct)+'%)</div>';

    var h='';
    // status of this round
    h+='<section><h2>บิลรอบนี้ '+cur.length+' ใบ</h2>'+
       '<div class="tiles">'+
       '<div class="tile"><div class="n">'+done.length+'<small>ห้อง</small></div><div class="l"><span class="dot" style="background:var(--good)"></span>จ่ายครบแล้ว</div></div>'+
       '<div class="tile"><div class="n">'+owing.length+'<small>ห้อง</small></div><div class="l"><span class="dot" style="background:var(--critical)"></span>ยังค้างชำระ</div></div>'+
       '<div class="tile"><div class="n">'+waiting.length+'<small>ห้อง</small></div><div class="l"><span class="dot" style="background:var(--muted)"></span>รอจดมิเตอร์</div></div>'+
       '</div></section>';
    // rooms
    h+='<section><h2>ห้องเช่าทั้งหมด</h2><div class="tiles">'+
       '<div class="tile"><div class="n">'+fmt(roomsTotal)+'<small>ห้อง</small></div><div class="l">ทั้งหมด</div></div>'+
       '<div class="tile"><div class="n">'+fmt(roomsTotal-vacant)+'<small>ห้อง</small></div><div class="l">มีผู้เช่า</div></div>'+
       '<div class="tile"><div class="n">'+fmt(vacant)+'<small>ห้อง</small></div><div class="l">ว่าง</div></div>'+
       '</div></section>';
    // breakdown
    var parts2=[['ค่าเช่า',S('rent'),'--s1'],['ค่าไฟ',S('elec'),'--s2'],['ค่าน้ำ',S('water'),'--s3'],['ค่าขยะ',S('trash'),'--s4'],['ค้างจ่ายยกมา',S('carry'),'--s5']];
    var sumParts=parts2.reduce(function(t,p){return t+p[1]},0), disc=S('disc');
    h+='<section><h2>ยอดบิลรอบนี้มาจากอะไรบ้าง</h2>';
    if(waiting.length) h+='<p class="note">ยังไม่รวมค่าไฟค่าน้ำของห้องที่รอจดมิเตอร์ '+waiting.length+' ห้อง</p>';
    if(sumParts>0){
      h+='<div class="stack">'+parts2.filter(function(p){return p[1]>0}).map(function(p){ return '<i style="flex:'+p[1]+' 0 0;background:var('+p[2]+')" data-tip="'+esc(p[0])+' '+fmt(p[1])+' บาท ('+(p[1]/sumParts*100).toFixed(1)+'%)"></i>'; }).join('')+'</div>';
      h+='<table><tbody>'+parts2.map(function(p){ return '<tr><td><span class="sw" style="background:var('+p[2]+')"></span>'+p[0]+'</td><td class="m">'+(p[1]/sumParts*100).toFixed(1)+'%</td><td>'+fmt(p[1])+'</td></tr>'; }).join('')+
         (disc>0?'<tr><td><span class="sw" style="background:transparent"></span>ส่วนลด</td><td></td><td>-'+fmt(disc)+'</td></tr>':'')+
         '</tbody><tfoot><tr><td>รวมยอดบิล</td><td></td><td>'+fmt(billed)+'</td></tr></tfoot></table>';
    }
    h+='</section>';
    // owing list
    h+='<section><h2>ห้องที่ยังค้างชำระ</h2>';
    if(owing.length){
      var mx=owing[0].remain;
      h+='<ul class="owe">'+owing.map(function(b){ return '<li><span class="nm">'+esc(b.name)+'</span><span class="bar"><i style="width:'+(b.remain/mx*100)+'%"></i></span><span class="amt">'+fmt(b.remain)+'</span></li>'; }).join('')+'</ul>';
    } else {
      h+='<div class="ok"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="11" fill="#0ca30c"/><path d="M6 11.5l3.2 3.2L16 8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'+(cur.length-waiting.length>0?'เก็บครบทุกห้องที่ออกบิลแล้ว':'ยังไม่มีบิลที่ออกแล้วในรอบนี้')+'</div>';
    }
    h+='</section>';
    if(waiting.length){
      h+='<section><h2>ห้องที่รอจดมิเตอร์</h2><div class="chips">'+waiting.map(function(b){return '<span>'+esc(b.name)+'</span>'}).join('')+'</div></section>';
    }
    // monthly
    var last=months.slice(-12);
    h+='<section><h2>รายได้แต่ละเดือน</h2><p class="note">รายได้ = ค่าเช่า + ค่าไฟ + ค่าน้ำ + ค่าขยะ − ส่วนลด ของบิลเดือนนั้น (ไม่นับยอดค้างยกมา)</p>';
    if(last.length>=2) h+=chart(last);
    var narrow=window.innerWidth<=520;
    h+='<div class="scroll"><table class="wide"><thead><tr><th>เดือน</th><th>ค่าเช่า</th><th>ค่าไฟ</th><th>ค่าน้ำ</th><th>รายได้</th><th>รับแล้ว</th><th>ค้างชำระ</th></tr></thead><tbody>'+
       last.slice().reverse().map(function(m){ return '<tr><td>'+ymLabel(m.ym, narrow?'yy':false)+'</td><td class="m">'+fmt(m.rent)+'</td><td class="m">'+fmt(m.elec)+'</td><td class="m">'+fmt(m.water)+'</td><td>'+fmt(m.rev)+'</td><td>'+fmt(m.paid)+'</td><td>'+fmt(m.remain)+'</td></tr>'; }).join('')+
       '</tbody></table></div>';
    if(!last.length) h+='<p class="note">ยังไม่มีข้อมูลรายเดือน</p>';
    h+='</section>';
    // yearly
    var years={}, order=[];
    months.forEach(function(m){ var y=parseInt(m.ym.slice(0,4),10)+543; if(!years[y]){ years[y]={rent:0,elec:0,water:0,rev:0,paid:0,n:0}; order.push(y); } var o=years[y]; o.rent+=m.rent; o.elec+=m.elec; o.water+=m.water; o.rev+=m.rev; o.paid+=m.paid; o.n+=1; });
    h+='<section><h2>สรุปรายปี</h2><div class="scroll"><table class="wide"><thead><tr><th>ปี</th><th>ค่าเช่า</th><th>ค่าไฟ</th><th>ค่าน้ำ</th><th>รายได้</th><th>รับแล้ว</th></tr></thead><tbody>'+
       order.slice().reverse().map(function(y){ var o=years[y]; return '<tr><td>'+y+'</td><td class="m">'+fmt(o.rent)+'</td><td class="m">'+fmt(o.elec)+'</td><td class="m">'+fmt(o.water)+'</td><td>'+fmt(o.rev)+'</td><td>'+fmt(o.paid)+'</td></tr>'; }).join('')+
       '</tbody></table></div></section>';
    var now=new Date();
    h+='<p class="foot">ข้อมูล ณ วันที่ '+now.getDate()+' '+TH[now.getMonth()]+' '+(now.getFullYear()+543)+' เวลา '+('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2)+' น. อยากดูตัวเลขล่าสุด ให้กลับไปที่แอปแล้วกดปุ่ม “สรุปแบบกราฟ” อีกครั้ง</p>';
    document.getElementById('main').innerHTML=h;
    tips();
  }
  function niceMax(v){ if(v<=0) return 1; var p=Math.pow(10,Math.floor(Math.log10(v))), f=v/p; var n = f<=1?1 : f<=2?2 : f<=2.5?2.5 : f<=5?5 : 10; return n*p; }
  function chart(ms){
    var cw=(document.getElementById('main').clientWidth||860)-40, small=cw<480, W=Math.max(280,cw), H=small?210:240, fs=small?11.5:14, L=small?62:64, R=small?6:16, T=18, B=small?32:40, iw=W-L-R, ih=H-T-B;
    var mx=niceMax(Math.max.apply(null,ms.map(function(m){return m.rev}))), ticks=4, s='';
    s+='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="กราฟรายได้แต่ละเดือน" style="display:block;margin:6px 0 14px">';
    for(var i=0;i<=ticks;i++){ var v=mx*i/ticks, y=T+ih-ih*i/ticks; s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#e3e8f4" stroke-width="1"/><text x="'+(L-10)+'" y="'+(y+5)+'" text-anchor="end" font-size="'+fs+'" fill="#5b6785">'+fmt(v)+'</text>'; }
    var band=iw/ms.length, bw=Math.min(24,band*0.6), every=(band<34?2:1);
    ms.forEach(function(m,ix){
      var cx=L+band*ix+band/2, bh=Math.max(0,ih*m.rev/mx), y=T+ih-bh, x=cx-bw/2, r=Math.min(4,bh);
      s+='<path d="M'+x+' '+(T+ih)+' V'+(y+r)+' Q'+x+' '+y+' '+(x+r)+' '+y+' H'+(x+bw-r)+' Q'+(x+bw)+' '+y+' '+(x+bw)+' '+(y+r)+' V'+(T+ih)+' Z" fill="#2a78d6"/>';
      s+='<rect x="'+(L+band*ix)+'" y="'+T+'" width="'+band+'" height="'+ih+'" fill="transparent" data-tip="'+ymLabel(m.ym)+' รายได้ '+fmt(m.rev)+' บาท รับแล้ว '+fmt(m.paid)+' บาท"/>';
      var yr=(ix===0||/-0?1$/.test(m.ym))? ' '+String(parseInt(m.ym.slice(0,4),10)+543).slice(-2) : '';
      if((ms.length-1-ix)%every===0) s+='<text x="'+cx+'" y="'+(H-(small?10:14))+'" text-anchor="middle" font-size="'+fs+'" fill="#5b6785">'+ymLabel(m.ym,true)+(every===1?yr:'')+'</text>';
      if(ix===ms.length-1) s+='<text x="'+(small?cx+bw/2:cx)+'" y="'+(y-7)+'" text-anchor="'+(small?'end':'middle')+'" font-size="'+fs+'" font-weight="600" fill="#12203f">'+fmt(m.rev)+'</text>';
    });
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ih)+'" y2="'+(T+ih)+'" stroke="#c9d3ea" stroke-width="1"/></svg>';
    return s;
  }
  function tips(){
    var tip=document.getElementById('tip');
    function show(e){ var t=e.target.closest? e.target.closest('[data-tip]') : null; if(!t){ tip.style.display='none'; return; } tip.textContent=t.getAttribute('data-tip'); tip.style.display='block'; var x=Math.min(window.innerWidth-tip.offsetWidth-8, Math.max(8,e.clientX-tip.offsetWidth/2)), y=e.clientY-tip.offsetHeight-12; if(y<8) y=e.clientY+16; tip.style.left=x+'px'; tip.style.top=y+'px'; }
    document.addEventListener('pointermove',show); document.addEventListener('pointerdown',show);
    document.addEventListener('scroll',function(){ tip.style.display='none'; },true);
  }
  var tipsOn=false, _tips=tips; tips=function(){ if(!tipsOn){ tipsOn=true; _tips(); } };
  getHash(function(h){ var raw=h; try{ raw=decodeURIComponent(h); }catch(e){} render(raw); var lw=window.innerWidth, t; window.addEventListener('resize',function(){ if(window.innerWidth===lw) return; lw=window.innerWidth; clearTimeout(t); t=setTimeout(function(){ render(raw); },150); }); });
})();
</script>
</body>
</html>
